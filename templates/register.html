{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-wrap"><div class="eyebrow">JOIN THE NETWORK</div><h1>Create your account</h1><p class="muted">Choose the role that best describes you.</p>
<form method="post" class="form">
<label>Full name / Organization name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="6" required></label>
<label>Account type<select name="role" required><option value="donor">Food donor</option><option value="ngo">NGO / Food bank</option><option value="volunteer">Volunteer</option></select></label>
<label>City<input name="city" required placeholder="e.g. Chennai"></label>
<label>Phone (optional)<input name="phone" placeholder="Contact number"></label>
<button class="btn full">Create account</button></form></div>{% endblock %}
